name: Build / Release

run-name: ${{ inputs.publish_release && format('Release {0}', inputs.tag_name) || format('Build {0} Preview', inputs.source_ref) }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag name that requested the build"
        required: true
        type: string
      source_sha:
        description: "Exact commit SHA to build"
        required: true
        type: string
      tag_name:
        description: "Release/package version name, for example v0.4.0"
        required: true
        type: string
      publish_release:
        description: "Publish a stable release from its v* tag"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_ref }}-${{ inputs.publish_release && 'stable' || 'preview' }}
  cancel-in-progress: ${{ !inputs.publish_release }}

permissions:
  actions: write
  contents: read

env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_IS_DEV=OFF -DLLAMA_BUILD_UI=ON -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_RPC=ON"

jobs:
  release-meta:
    name: Publication metadata
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.meta.outputs.source_ref }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version_name: ${{ steps.meta.outputs.version_name }}
      release_title: ${{ steps.meta.outputs.release_title }}
      preview: ${{ steps.meta.outputs.preview }}
      stable_release: ${{ steps.meta.outputs.stable_release }}
      build_packages: ${{ steps.meta.outputs.build_packages }}
      publish_docker: ${{ steps.meta.outputs.publish_docker }}
      cache_channel: ${{ steps.meta.outputs.cache_channel }}
      cache_parent_channel: ${{ steps.meta.outputs.cache_parent_channel }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Prune stale release caches
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const liveBranches = [];
            const caches = [];

            for (let page = 1; ; page += 1) {
              const { data } = await github.rest.repos.listBranches({
                owner,
                repo,
                per_page: 100,
                page,
              });
              liveBranches.push(...data
                .map((branch) => branch.name)
                .filter((name) => /^v[0-9][0-9A-Za-z._-]*$/.test(name)));
              if (data.length < 100) {
                break;
              }
            }

            for (let page = 1; ; page += 1) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page,
              });
              const pageCaches = data.actions_caches ?? [];
              caches.push(...pageCaches);
              if (pageCaches.length < 100) {
                break;
              }
            }

            let deleted = 0;
            for (const cache of caches) {
              if (!cache.key.startsWith("release-")) {
                continue;
              }
              const liveChannel = liveBranches.some((branch) => {
                const prefix = `release-${branch}-`;
                if (!cache.key.startsWith(prefix)) {
                  return false;
                }
                return /^(macos|ubuntu|windows)-/.test(cache.key.slice(prefix.length));
              });
              if (cache.ref === "refs/heads/main" && liveChannel) {
                continue;
              }
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id,
                });
                deleted += 1;
                core.info(`Deleted stale release cache ${cache.key} on ${cache.ref}.`);
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
            core.info(`Kept release caches for live branches: ${liveBranches.join(", ") || "none"}.`);
            core.info(`Deleted ${deleted} stale or incorrectly scoped release cache entries.`);

      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          build_packages="true"
          publish_docker="true"

          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Unsupported event ${EVENT_NAME}; builds must use main-owned workflow_dispatch." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Build workflow_dispatch must run on main, not ${GITHUB_REF}." >&2
            exit 1
          fi

          source_ref="${INPUT_SOURCE_REF}"
          source_sha="${INPUT_SOURCE_SHA}"
          tag_name="${INPUT_TAG_NAME}"

          if [[ "${INPUT_PUBLISH_RELEASE}" == "true" ]]; then
            version_name="${tag_name}"
            release_title="${tag_name}"
            preview="false"
            stable_release="true"
          else
            version_name="${source_ref}"
            release_title="${source_ref} Preview"
            preview="true"
            stable_release="false"
          fi

          if [[ ! "${version_name}" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Version name ${version_name} is not safe for release assets and Docker tags." >&2
            exit 1
          fi

          if [[ -z "${source_sha}" || ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA." >&2
            exit 1
          fi
          if ! git cat-file -e "${source_sha}^{commit}"; then
            git fetch origin +refs/heads/"${source_ref}":refs/remotes/origin/"${source_ref}" --no-tags || true
            git fetch origin +refs/tags/"${source_ref}":refs/tags/"${source_ref}" || true
          fi
          if ! git cat-file -e "${source_sha}^{commit}"; then
            git fetch origin "${source_sha}" --no-tags
          fi
          git cat-file -e "${source_sha}^{commit}"

          cmake_lists="$(git show "${source_sha}:CMakeLists.txt")"
          version_major="$(sed -nE 's/^set\(LLAMA_VERSION_MAJOR[[:space:]]+([0-9]+)\)[[:space:]]*$/\1/p' <<< "${cmake_lists}")"
          version_minor="$(sed -nE 's/^set\(LLAMA_VERSION_MINOR[[:space:]]+([0-9]+)\)[[:space:]]*$/\1/p' <<< "${cmake_lists}")"
          version_patch="$(sed -nE 's/^set\(LLAMA_VERSION_PATCH[[:space:]]+([0-9]+)\)[[:space:]]*$/\1/p' <<< "${cmake_lists}")"
          if [[ -z "${version_major}" || -z "${version_minor}" || -z "${version_patch}" ]]; then
            echo "Could not read the release version from CMakeLists.txt at ${source_sha}." >&2
            exit 1
          fi
          source_version="${version_major}.${version_minor}.${version_patch}"
          if [[ "${version_name#v}" != "${source_version}" ]]; then
            echo "Requested version ${version_name} does not match source version v${source_version}." >&2
            exit 1
          fi

          if [[ "${preview}" == "true" ]]; then
            if [[ "${source_ref}" != v* || "${tag_name}" != "preview-${source_ref}" ]]; then
              echo "Invalid preview metadata: source_ref=${source_ref}, tag_name=${tag_name}." >&2
              exit 1
            fi
            git fetch origin +refs/heads/"${source_ref}":refs/remotes/origin/"${source_ref}" --no-tags
            branch_commit="$(git rev-parse refs/remotes/origin/"${source_ref}")"
            if [[ "${branch_commit}" != "${source_sha}" ]]; then
              echo "Branch ${source_ref} points to ${branch_commit}, not requested source ${source_sha}." >&2
              exit 1
            fi
          else
            if [[ "${tag_name}" != v* ]]; then
              echo "Release publishing requires a v* tag_name." >&2
              exit 1
            fi
            if [[ "${source_ref}" != "${tag_name}" ]]; then
              echo "Stable release source_ref ${source_ref} must match tag_name ${tag_name}." >&2
              exit 1
            fi
            git fetch origin +refs/tags/"${tag_name}":refs/tags/"${tag_name}"
            tag_commit="$(git rev-list -n 1 "${tag_name}")"
            if [[ "${tag_commit}" != "${source_sha}" ]]; then
              echo "Tag ${tag_name} points to ${tag_commit}, not requested source ${source_sha}." >&2
              exit 1
            fi
            git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
            if ! git merge-base --is-ancestor "${source_sha}" refs/remotes/origin/main; then
              echo "Tag ${tag_name} is not reachable from origin/main; refusing to publish." >&2
              exit 1
            fi
            git fetch origin +refs/heads/"${source_ref}":refs/remotes/origin/"${source_ref}" --no-tags
            branch_commit="$(git rev-parse refs/remotes/origin/"${source_ref}")"
            if ! git merge-base --is-ancestor "${branch_commit}" "${source_sha}"; then
              echo "Release branch ${source_ref} at ${branch_commit} is not an ancestor of tag ${source_sha}." >&2
              exit 1
            fi
          fi

          cache_channel="${source_ref}"
          cache_parent_channel="$(
            python3 .github/scripts/resolve-release-cache-parent.py \
              --source-ref "${source_ref}" \
              --source-sha "${source_sha}"
          )"

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          image_repo="ghcr.io/${owner}/${repo}"

          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${release_title}" >> "${GITHUB_OUTPUT}"
          echo "preview=${preview}" >> "${GITHUB_OUTPUT}"
          echo "stable_release=${stable_release}" >> "${GITHUB_OUTPUT}"
          echo "build_packages=${build_packages}" >> "${GITHUB_OUTPUT}"
          echo "publish_docker=${publish_docker}" >> "${GITHUB_OUTPUT}"
          echo "cache_channel=${cache_channel}" >> "${GITHUB_OUTPUT}"
          echo "cache_parent_channel=${cache_parent_channel}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=${image_repo}" >> "${GITHUB_OUTPUT}"
          short_sha="${source_sha::12}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "Using source ref: ${source_ref}"
          echo "Using source SHA: ${source_sha}"
          echo "Using package version: ${tag_name}"
          echo "Release title: ${release_title}"
          echo "Preview: ${preview}"
          echo "Build packages: ${build_packages}"
          echo "Publish Docker images: ${publish_docker}"
          echo "Cache parent channel: ${cache_parent_channel:-none}"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}

  macos-arm64:
    name: macOS arm64 Metal
    needs: release-meta
    if: ${{ needs.release-meta.outputs.build_packages == 'true' }}
    runs-on: macos-14
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-macos-arm64
          restore-keys: release-${{ needs.release-meta.outputs.cache_parent_channel }}-macos-arm64

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j "$(sysctl -n hw.logicalcpu)"
          test -s build/tools/ui/dist/index.html

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Skip on failure: a crashed build stores nothing and refreshes no entry
        # mtimes, so evict-old-files could cull healthy entries and save a
        # degraded cache. Cancelled (e.g. 6h timeout) jobs keep their partial
        # progress so the next run resumes from it.
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-macos-arm64
          ref: refs/heads/main
          evict-old-files: 1d

      - name: Smoke package binaries
        run: |
          ./build/bin/llama-server --version
          ./build/bin/llama-cli --version

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf "beellama-${{ needs.release-meta.outputs.tag_name }}-bin-macos-arm64.tar.gz" \
            -s ",^\.,beellama-${{ needs.release-meta.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: beellama-${{ needs.release-meta.outputs.tag_name }}-bin-macos-arm64.tar.gz
          name: beellama-bin-macos-arm64.tar.gz

  ubuntu-cpu:
    name: Ubuntu ${{ matrix.build }} CPU
    needs: release-meta
    if: ${{ needs.release-meta.outputs.build_packages == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: x64
            os: ubuntu-22.04
          - build: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-${{ matrix.os }}-cpu
          restore-keys: release-${{ needs.release-meta.outputs.cache_parent_channel }}-${{ matrix.os }}-cpu

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Toolchain workaround
        if: ${{ contains(matrix.os, 'ubuntu-24.04') }}
        run: |
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "${GITHUB_ENV}"
          echo "CXX=g++-14" >> "${GITHUB_ENV}"

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j "$(nproc)"
          test -s build/tools/ui/dist/index.html

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Skip on failure: a crashed build stores nothing and refreshes no entry
        # mtimes, so evict-old-files could cull healthy entries and save a
        # degraded cache. Cancelled (e.g. 6h timeout) jobs keep their partial
        # progress so the next run resumes from it.
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-${{ matrix.os }}-cpu
          ref: refs/heads/main
          evict-old-files: 1d

      - name: Smoke package binaries
        run: |
          file ./build/bin/llama-server
          ./build/bin/llama-server --version
          ./build/bin/llama-cli --version

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf "beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-${{ matrix.build }}.tar.gz" \
            --transform "s,^\.,beellama-${{ needs.release-meta.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-${{ matrix.build }}.tar.gz
          name: beellama-bin-ubuntu-${{ matrix.build }}.tar.gz

  ubuntu-vulkan:
    name: Ubuntu x64 Vulkan
    needs: release-meta
    if: ${{ needs.release-meta.outputs.build_packages == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-ubuntu-vulkan-x64
          restore-keys: release-${{ needs.release-meta.outputs.cache_parent_channel }}-ubuntu-vulkan-x64

      - name: Dependencies
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j "$(nproc)"
          test -s build/tools/ui/dist/index.html

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Skip on failure: a crashed build stores nothing and refreshes no entry
        # mtimes, so evict-old-files could cull healthy entries and save a
        # degraded cache. Cancelled (e.g. 6h timeout) jobs keep their partial
        # progress so the next run resumes from it.
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-ubuntu-vulkan-x64
          ref: refs/heads/main
          evict-old-files: 1d

      - name: Smoke package binaries
        run: |
          ./build/bin/llama-server --version
          ./build/bin/llama-cli --version

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf "beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-vulkan-x64.tar.gz" \
            --transform "s,^\.,beellama-${{ needs.release-meta.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-vulkan-x64.tar.gz
          name: beellama-bin-ubuntu-vulkan-x64.tar.gz

  ubuntu-rocm:
    name: Ubuntu x64 ROCm
    needs: release-meta
    if: ${{ needs.release-meta.outputs.build_packages == 'true' }}
    runs-on: ubuntu-22.04
    env:
      ROCM_VERSION: "7.2.1"
      GPU_TARGETS: "gfx908;gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1102;gfx1151;gfx1150;gfx1200;gfx1201"
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Free up disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-ubuntu-rocm-${{ env.ROCM_VERSION }}-x64
          restore-keys: release-${{ needs.release-meta.outputs.cache_parent_channel }}-ubuntu-rocm-${{ env.ROCM_VERSION }}-x64

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake wget libssl-dev

      - name: Setup ROCm
        run: |
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget https://repo.radeon.com/rocm/rocm.gpg.key -O - | \
            gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          sudo tee /etc/apt/sources.list.d/rocm.list << EOF
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} jammy main
          EOF
          sudo tee /etc/apt/preferences.d/rocm-pin-600 << EOF
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600
          EOF
          sudo apt-get update
          sudo apt-get install -y rocm-hip-sdk

      - name: Build
        run: |
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGPU_TARGETS="${GPU_TARGETS}" \
            -DGGML_HIP=ON \
            -DGGML_CUDA_KVARN=ON \
            -DGGML_CUDA_FA=ON \
            -DHIP_PLATFORM=amd \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j "$(nproc)"
          test -s build/tools/ui/dist/index.html

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Skip on failure: a crashed build stores nothing and refreshes no entry
        # mtimes, so evict-old-files could cull healthy entries and save a
        # degraded cache. Cancelled (e.g. 6h timeout) jobs keep their partial
        # progress so the next run resumes from it.
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-ubuntu-rocm-${{ env.ROCM_VERSION }}-x64
          ref: refs/heads/main
          evict-old-files: 1d

      - name: Smoke package binaries
        run: |
          ./build/bin/llama-server --version
          ./build/bin/llama-cli --version

      - name: Pack artifacts
        run: |
          rocm_short="$(echo "${ROCM_VERSION}" | cut -d '.' -f 1,2)"
          cp LICENSE ./build/bin/
          tar -czvf "beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-rocm-${rocm_short}-x64.tar.gz" \
            --transform "s,^\.,beellama-${{ needs.release-meta.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-rocm-7.2-x64.tar.gz
          name: beellama-bin-ubuntu-rocm-7.2-x64.tar.gz

  ubuntu-sycl:
    name: Ubuntu x64 SYCL
    needs: release-meta
    if: ${{ needs.release-meta.outputs.build_packages == 'true' }}
    runs-on: ubuntu-24.04
    env:
      ONEAPI_ROOT: /opt/intel/oneapi
      ONEAPI_INSTALLER_VERSION: "2025.3.3"
      ONEAPI_INSTALLER_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/56f7923a-adb8-43f3-8b02-2b60fcac8cab/intel-deep-learning-essentials-2025.3.3.16_offline.sh
      LEVEL_ZERO_VERSION: "1.28.2"
      LEVEL_ZERO_UBUNTU_VERSION: "u24.04"
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Free up disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Prepare oneAPI cache path
        run: |
          sudo mkdir -p "${ONEAPI_ROOT}"
          sudo chown -R "${USER}:${USER}" /opt/intel

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-ubuntu-sycl-${{ env.ONEAPI_INSTALLER_VERSION }}-x64
          restore-keys: release-${{ needs.release-meta.outputs.cache_parent_channel }}-ubuntu-sycl-${{ env.ONEAPI_INSTALLER_VERSION }}-x64

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build wget ca-certificates libssl-dev

      - name: Install oneAPI
        run: |
          installer="${RUNNER_TEMP}/intel-deep-learning-essentials-${ONEAPI_INSTALLER_VERSION}.sh"
          wget "${ONEAPI_INSTALLER_URL}" -O "${installer}"
          sudo bash "${installer}" -s -a --silent --eula accept
          sudo chown -R "${USER}:${USER}" "${ONEAPI_ROOT}"

      - name: Install Level Zero SDK
        run: |
          cd /tmp
          wget -q "https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}/level-zero_${LEVEL_ZERO_VERSION}%2B${LEVEL_ZERO_UBUNTU_VERSION}_amd64.deb" -O level-zero.deb
          wget -q "https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}/level-zero-devel_${LEVEL_ZERO_VERSION}%2B${LEVEL_ZERO_UBUNTU_VERSION}_amd64.deb" -O level-zero-devel.deb
          sudo apt-get -o Dpkg::Options::="--force-overwrite" install -y ./level-zero.deb ./level-zero-devel.deb

      - name: Build
        run: |
          source "${ONEAPI_ROOT}/setvars.sh"
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_SYCL=ON \
            -DGGML_SYCL_F16=OFF \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j "$(nproc)"
          test -s build/tools/ui/dist/index.html

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Skip on failure: a crashed build stores nothing and refreshes no entry
        # mtimes, so evict-old-files could cull healthy entries and save a
        # degraded cache. Cancelled (e.g. 6h timeout) jobs keep their partial
        # progress so the next run resumes from it.
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-ubuntu-sycl-${{ env.ONEAPI_INSTALLER_VERSION }}-x64
          ref: refs/heads/main
          evict-old-files: 1d

      - name: Smoke package binaries
        run: |
          source "${ONEAPI_ROOT}/setvars.sh"
          test -s ./build/bin/libggml-sycl.so
          ldd ./build/bin/libggml-sycl.so
          mv ./build/bin/libggml-sycl.so ./build/bin/libggml-sycl.so.smoke-disabled
          trap 'mv ./build/bin/libggml-sycl.so.smoke-disabled ./build/bin/libggml-sycl.so' EXIT
          ./build/bin/llama-server --version
          ./build/bin/llama-cli --version

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf "beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-sycl-x64.tar.gz" \
            --transform "s,^\.,beellama-${{ needs.release-meta.outputs.tag_name }}," \
            -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: beellama-${{ needs.release-meta.outputs.tag_name }}-bin-ubuntu-sycl-x64.tar.gz
          name: beellama-bin-ubuntu-sycl-x64.tar.gz

