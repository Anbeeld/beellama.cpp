  windows-cpu:
    name: Windows x64 CPU
    needs: release-meta
    if: ${{ needs.release-meta.outputs.build_packages == 'true' }}
    runs-on: windows-2025
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-windows-cpu-x64
          restore-keys: release-${{ needs.release-meta.outputs.cache_parent_channel }}-windows-cpu-x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL_DIR=%%i"
          if not defined VS_INSTALL_DIR (
            echo No Visual Studio installation with the x64 C++ toolset was found
            exit /b 1
          )
          call "%VS_INSTALL_DIR%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            -DGGML_OPENMP_FETCH=ON ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            %CMAKE_ARGS%
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%
          if not exist build\tools\ui\dist\index.html (
            echo Source-built UI output is missing
            exit /b 1
          )

      - name: Verify OpenMP is enabled
        shell: cmd
        run: |
          findstr /c:"GGML_OPENMP_ENABLED:INTERNAL=ON" build\CMakeCache.txt >nul || (
            echo GGML_OPENMP=ON was requested but OpenMP was not found; the CPU backend would ship without it
            exit /b 1
          )

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Skip on failure: a crashed build stores nothing and refreshes no entry
        # mtimes, so evict-old-files could cull healthy entries and save a
        # degraded cache. Cancelled (e.g. 6h timeout) jobs keep their partial
        # progress so the next run resumes from it.
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-windows-cpu-x64
          ref: refs/heads/main
          evict-old-files: 1d

      - name: Pack artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = ".\build\bin\Release"
          Copy-Item ".\LICENSE" $bin
          python scripts\verify-windows-package.py `
            --require-name "libomp.dll" `
            --require-name "LICENSE-LLVM-OpenMP" `
            --forbid-name "libomp140.x86_64.dll" `
            $bin

          $serverVersion = (& "$bin\llama-server.exe" --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "llama-server --version failed with exit code $LASTEXITCODE"
          }
          Write-Host $serverVersion
          $expectedVersion = "${{ needs.release-meta.outputs.version_name }}".TrimStart("v")
          $sourceCommit = "${{ needs.release-meta.outputs.source_sha }}"
          if ($serverVersion -notmatch "version:\s+$([regex]::Escape($expectedVersion))\b") {
            throw "llama-server version does not report $expectedVersion"
          }
          $commitMatch = [regex]::Match($serverVersion, "commit\s+([0-9a-f]+)\b")
          if (-not $commitMatch.Success -or -not $sourceCommit.StartsWith($commitMatch.Groups[1].Value)) {
            throw "llama-server version does not report source commit $sourceCommit"
          }
          & "$bin\llama-cli.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "llama-cli --version failed with exit code $LASTEXITCODE"
          }
          7z a -snl "beellama-bin-win-cpu-x64.zip" "$bin\*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: beellama-bin-win-cpu-x64.zip
          name: beellama-bin-win-cpu-x64.zip

  windows-sycl:
    name: Windows x64 SYCL
    needs: release-meta
    if: ${{ needs.release-meta.outputs.build_packages == 'true' }}
    runs-on: windows-2022
    env:
      WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/b60765d1-2b85-4e85-86b6-cb0e9563a699/intel-deep-learning-essentials-2025.3.3.18_offline.exe
      WINDOWS_DPCPP_MKL: intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel:intel.oneapi.win.dnnl:intel.oneapi.win.tbb.devel
      LEVEL_ZERO_SDK_URL: https://github.com/oneapi-src/level-zero/releases/download/v1.28.2/level-zero-win-sdk-1.28.2.zip
      ONEAPI_ROOT: 'C:\Program Files (x86)\Intel\oneAPI'
      ONEAPI_INSTALLER_VERSION: "2025.3.3"
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}
          fetch-depth: 0

      - name: Install oneAPI
        shell: cmd
        run: scripts\install-oneapi.bat "%WINDOWS_BASEKIT_URL%" "%WINDOWS_DPCPP_MKL%"

      - name: Install Level Zero SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "level-zero-win-sdk.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "level-zero-sdk"
          Invoke-WebRequest -Uri "${{ env.LEVEL_ZERO_SDK_URL }}" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractDir -Force
          $sdkRoot = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          if (-not $sdkRoot) {
            $sdkRoot = Get-Item $extractDir
          }
          "LEVEL_ZERO_V1_SDK_PATH=$($sdkRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-windows-sycl-${{ env.ONEAPI_INSTALLER_VERSION }}-x64
          restore-keys: release-${{ needs.release-meta.outputs.cache_parent_channel }}-windows-sycl-${{ env.ONEAPI_INSTALLER_VERSION }}-x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 --force
          icx --version
          cmake -G "Ninja" -B build ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_BACKEND_DL=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_CPU=OFF ^
            -DGGML_SYCL=ON ^
            -DGGML_SYCL_F16=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_TOOLS=OFF ^
            -DLLAMA_BUILD_SERVER=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target ggml-sycl

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Skip on failure: a crashed build stores nothing and refreshes no entry
        # mtimes, so evict-old-files could cull healthy entries and save a
        # degraded cache. Cancelled (e.g. 6h timeout) jobs keep their partial
        # progress so the next run resumes from it.
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: release-${{ needs.release-meta.outputs.cache_channel }}-windows-sycl-${{ env.ONEAPI_INSTALLER_VERSION }}-x64
          ref: refs/heads/main
          evict-old-files: 1d

      - name: Pack SYCL backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = ".\build\bin"
          Copy-Item ".\LICENSE" $bin -Force

          $runtimeFiles = @(
            "$env:ONEAPI_ROOT\mkl\latest\bin\mkl_sycl_blas.5.dll",
            "$env:ONEAPI_ROOT\mkl\latest\bin\mkl_core.2.dll",
            "$env:ONEAPI_ROOT\mkl\latest\bin\mkl_tbb_thread.2.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\ur_adapter_level_zero.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\ur_adapter_level_zero_v2.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\ur_adapter_opencl.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\ur_loader.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\ur_win_proxy_loader.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\sycl8.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\svml_dispmd.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\libmmd.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\libiomp5md.dll",
            "$env:ONEAPI_ROOT\compiler\latest\bin\sycl-ls.exe",
            "$env:ONEAPI_ROOT\compiler\latest\bin\libsycl-fallback-bfloat16.spv",
            "$env:ONEAPI_ROOT\compiler\latest\bin\libsycl-native-bfloat16.spv",
            "$env:ONEAPI_ROOT\dnnl\latest\bin\dnnl.dll",
            "$env:ONEAPI_ROOT\tbb\latest\bin\tbb12.dll",
            "$env:ONEAPI_ROOT\tcm\latest\bin\tcm.dll",
            "$env:ONEAPI_ROOT\tcm\latest\bin\libhwloc-15.dll",
            "$env:ONEAPI_ROOT\umf\latest\bin\umf.dll"
          )

          foreach ($file in $runtimeFiles) {
            Copy-Item -LiteralPath $file -Destination $bin -Force
          }

          $zeLoader = Get-ChildItem -Path @($env:ONEAPI_ROOT, $env:LEVEL_ZERO_V1_SDK_PATH) -Recurse -Filter "ze_loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zeLoader) {
            Copy-Item -LiteralPath $zeLoader.FullName -Destination $bin -Force
          } else {
            Write-Warning "ze_loader.dll was not found in oneAPI or the Level Zero SDK; relying on the system driver runtime"
          }

          python scripts\verify-windows-package.py $bin
          7z a -snl "beellama-bin-win-sycl-x64.zip" "$bin\*"

      - name: Upload SYCL backend
        uses: actions/upload-artifact@v6
        with:
          path: beellama-bin-win-sycl-x64.zip
          name: beellama-bin-win-sycl-x64.zip

